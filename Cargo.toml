[package]
name = "ableton-cli"
version = "0.1.0"
edition = "2024"
description = "CLI utility for inspecting and transforming Ableton Live projects"
license = "MIT"
repository = "https://github.com/AlexanderBeahm/ableton-cli"

[lib]
name = "ableton_cli"
path = "src/lib.rs"

[[bin]]
name = "ableton-cli"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
flate2 = "1.0"
roxmltree = "0.20"
thiserror = "1.0"
anyhow = "1.0"
walkdir = "2"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.10"

[profile.release]
lto = true
codegen-units = 1
strip = true
