name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    name: Detect version bump and validate notes
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.detect.outputs.version }}
      should_release: ${{ steps.detect.outputs.should_release }}
      notes: ${{ steps.detect.outputs.notes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect version change and extract release notes
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          extract_version() {
            grep -E '^version\s*=' "$1" | head -1 | sed -E 's/.*"(.+)".*/\1/'
          }

          CURRENT_VERSION=$(extract_version Cargo.toml)
          echo "Current Cargo.toml version: $CURRENT_VERSION"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PREV_VERSION=""
            echo "Manual dispatch — treating previous version as empty (always release)."
          elif git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            PREV_VERSION=$(git show HEAD~1:Cargo.toml 2>/dev/null \
              | grep -E '^version\s*=' \
              | head -1 \
              | sed -E 's/.*"(.+)".*/\1/' || echo "")
            echo "Previous Cargo.toml version: ${PREV_VERSION:-<none>}"
          else
            PREV_VERSION=""
            echo "No previous commit available — treating previous version as empty."
          fi

          if [ -n "$PREV_VERSION" ] && [ "$CURRENT_VERSION" = "$PREV_VERSION" ]; then
            echo "Version unchanged — skipping release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ ! -f HISTORY.md ]; then
            echo "::error::HISTORY.md is missing at the repository root."
            echo "Add a section '## v$CURRENT_VERSION - YYYY-MM-DD' with release notes."
            exit 1
          fi

          NOTES=$(awk -v ver="v$CURRENT_VERSION" '
            $0 ~ "^## " ver "( |$)" { flag = 1; next }
            /^## v/ { flag = 0 }
            flag { print }
          ' HISTORY.md)

          NOTES=$(printf '%s' "$NOTES" | sed -e '/./,$!d' | sed -e ':a' -e '/^\s*$/{$d;N;ba' -e '}')

          if [ -z "$NOTES" ]; then
            echo "::error::HISTORY.md is missing an entry for v$CURRENT_VERSION."
            echo "Add release notes under a heading '## v$CURRENT_VERSION - YYYY-MM-DD' before merging the version bump."
            exit 1
          fi

          echo "Release notes extracted for v$CURRENT_VERSION:"
          echo "----"
          echo "$NOTES"
          echo "----"

          {
            echo "version=$CURRENT_VERSION"
            echo "should_release=true"
            echo "notes<<NOTES_EOF"
            echo "$NOTES"
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs: gate
    if: needs.gate.outputs.should_release == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: ableton-cli
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: ableton-cli.exe
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.artifact }}" "dist/"
      - uses: actions/upload-artifact@v4
        with:
          name: ableton-cli-${{ matrix.target }}
          path: dist/${{ matrix.artifact }}

  publish:
    name: Tag and publish GitHub Release
    needs: [gate, build]
    if: needs.gate.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Stage release files
        shell: bash
        run: |
          set -eux
          mkdir -p release
          for dir in artifacts/ableton-cli-*/; do
            name=$(basename "$dir")
            for file in "$dir"*; do
              base=$(basename "$file")
              ext=""
              if [[ "$base" == *.* ]]; then
                ext=".${base##*.}"
              fi
              cp "$file" "release/${name}${ext}"
            done
          done
          ls -la release/

      - name: Create tag
        shell: bash
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          set -eux
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "::error::Tag v$VERSION already exists. Delete the tag/release manually before re-running."
            exit 1
          fi
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push origin "v$VERSION"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.gate.outputs.version }}
          name: v${{ needs.gate.outputs.version }}
          body: ${{ needs.gate.outputs.notes }}
          files: release/*
          fail_on_unmatched_files: true
